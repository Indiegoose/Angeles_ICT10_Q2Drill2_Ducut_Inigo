<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Catering Club</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<style>
        body {
            background-color: #ffe6f2;
            font-family: 'Trebuchet MS', sans-serif;
            padding: 20px;
        }
        #container {
            background-color: #ffffff;
            border: 3px dashed #ff99cc;
            border-radius: 20px;
            max-width: 550px;
            margin: 30px auto;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.15);
        }
        #header {
            text-align: center;
        }
        #logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff66b2;
            object-fit: cover;
            object-position: top;
            margin-bottom: 10px;
        }
        h1 {
            color: #ff3399;
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0;
        }
        #subtitle {
            color: #cc6699;
            font-weight: bold;
            margin: 0;
        }
        label {
            display: block;
            color: #b30059;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ffb3d9;
            border-radius: 12px;
            background-color: #fff9fc;
        }
        input:focus {
            outline: none;
            border-color: #ff4da6;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff66b2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff3399;
        }
        #output {
            background-color: #fff0f7;
            border: 2px solid #ffcce6;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            color: #660033;
        }
    </style>
<body>

    <div id="container">
        <div id="header">
            <h1>🌈 Rainbow Catering Club 🧁</h1>
            <p id="subtitle">Member List:</p>
        </div>
        <br>
        <div>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" placeholder="Enter first name">
        </div>

        <div>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" placeholder="Enter last name">
        </div>
        <br>
        <button py-click="add_member">Add Member</button>
        <br>
        <div id="output"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
